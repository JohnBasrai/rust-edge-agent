[package]
name = "rust-edge-agent"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
async-nats = "0.35"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
futures = "0.3"
mom-rpc = { version = "0.3", features = ["transport_rumqttc"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"

[[bin]]
name = "rust-edge-agent"
path = "src/main.rs"

[[bin]]
name = "device_sim"
path = "src/bin/device_sim.rs"
