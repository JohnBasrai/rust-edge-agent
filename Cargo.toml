[package]
name = "rust-edge-agent"
version = "0.3.2"
edition = "2021"
license = "MIT OR Apache-2.0"
keywords = ["mqtt", "nats", "edge-gateway", "iot", "rpc", "arm64"]
categories = ["embedded", "network-programming", "asynchronous"]
description = "Edge gateway for coordinating heterogeneous devices via dual-protocol messaging (NATS + MQTT)"

[dependencies]
anyhow = "1.0"
async-nats = "0.35"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
mom-rpc = { version = "0.7", features = ["transport_rumqttc"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "rust-edge-agent"
path = "src/main.rs"

[[bin]]
name = "device_sim"
path = "src/bin/device_sim.rs"

[lints.clippy]
uninlined-format-args = "warn"
