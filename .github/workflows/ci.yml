name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            qemu-user

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Lint (fmt + clippy)
        run: scripts/ci-lint.sh

      - name: Native build
        run: scripts/ci-build-native.sh

      - name: AArch64 cross-build
        run: scripts/ci-build-aarch64.sh

      - name: QEMU AArch64 smoke test
        run: scripts/ci-qemu-smoke.sh
